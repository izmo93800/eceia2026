<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ballon d'Or</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #111;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            color: #d4af37;
            font-size: 2.5em;
            margin-bottom: 30px;
        }
        .carte {
            background: #1e1e1e;
            border: 3px solid #d4af37;
            border-radius: 16px;
            width: 320px;
            padding: 35px;
            text-align: center;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
        }
        .trophee {
            font-size: 4em;
        }
        .drapeau {
            font-size: 2.5em;
        }
        .carte h2 {
            margin: 10px 0 5px;
            font-size: 1.8em;
        }
        .carte p {
            margin: 4px 0;
            color: #bbb;
        }
        .club {
            display: inline-block;
            margin-top: 15px;
            padding: 6px 14px;
            background: #d4af37;
            color: #111;
            border-radius: 20px;
            font-weight: bold;
        }
        .vainqueur {
            margin-top: 20px;
            color: #d4af37;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <h1>🏆 Ballon d'Or</h1>

    <article class="carte">
        <div class="trophee">🏆</div>
        <div class="drapeau">🇫🇷</div>
        <h2>Kylian Mbappé</h2>
        <p>France</p>
        <p>Attaquant</p>
        <span class="club">Real Madrid</span>
        <p class="vainqueur">Vainqueur</p>
    </article>

</body>
</html>
